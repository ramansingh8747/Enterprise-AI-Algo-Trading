databases:
  - name: algo-trading-db
    databaseName: algo_trading
    user: algo_user
    plan: free

services:
  - type: web
    name: algo-trading-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algo-trading-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BROKER_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: '["*"]'
      - key: LIVE_TRADING_ENABLED
        value: "False"
      - key: STRATEGY_SCHEDULER_ENABLED
        value: "True"
      - key: STRATEGY_SCHEDULER_INTERVAL_SECONDS
        value: "5"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ENVIRONMENT
        value: "staging"
  - type: web
    name: algo-trading-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://algo-trading-backend-bqrc.onrender.com/api/v1"
